<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Classification" [options]="false">
      <h5>{{ isCreatingClaasificationForm ? "Create" : "Update" }}classification</h5>
      <hr />
      <div class="row">
        <form [formGroup]="classificationTypeForm" (ngSubmit)="onSubmit()">
          <div class="col-md-6">

            <div class="form-group row" *ngIf="!isCreatingClaasificationForm">
              <label for="id" class="col-sm-3 col-form-label">Id</label>
              <div class="col-sm-9">
                <input type="text" formControlName="id" class="form-control" id="id"
                       placeholder="id" readonly />
              </div>
            </div>

            <div class="form-group row">
              <label for="code" class="col-sm-3 col-form-label">Code</label>
              <div class="col-sm-9">
                <input type="text" formControlName="code" class="form-control" id="code"
                       placeholder="code" />
              </div>
              <small *ngIf="classificationTypeForm.get('code')?.invalid && classificationTypeForm.get('code')?.touched"
                     style="color: red;">
                Code is required.
              </small>
            </div>

            <div class="form-group row">
              <label for="name" class="col-sm-3 col-form-label">Name</label>
              <div class="col-sm-9">
                <input type="text" formControlName="name" class="form-control" id="name"
                       placeholder="name" />
              </div>
              <small *ngIf="classificationTypeForm.get('name')?.invalid && classificationTypeForm.get('name')?.touched"
                     style="color: red;">
                Name is required.
              </small>
            </div>
            <div class="form-group row">
              <label for="percent" class="col-sm-3 col-form-label">Percent</label>
              <div class="col-sm-9">
                <input type="text" formControlName="percent" class="form-control" id="percent"
                       placeholder="Budget name" />
              </div>
              <small
                *ngIf="classificationTypeForm.get('percent')?.invalid && classificationTypeForm.get('percent')?.touched"
                style="color: red;">
                Percent is required.
              </small>
            </div>
            <div class="form-group row">
              <div class="col-sm-10">
                <button type="submit" class="btn btn-primary">{{ isCreatingClaasificationForm ? "Save" : "Update" }}
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>

      <h5>Category list</h5>
      <hr />
      <div class="row">
        <div class="table-responsive">
          <table class="table">
            <thead>
            <tr>
              <th>Category ID</th>
              <th>Code</th>

              <th>
                Name
                <input type="text" [(ngModel)]="filterCategory" placeholder="Filter..." class="form-control">
              </th>
              <th>
                Transaction Type
                <input type="text" [(ngModel)]="filterTransactionType" placeholder="Filter..." class="form-control">
              </th>
              <th>Select</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let category of filteredCategories">
              <td>{{ category.categoryId }}</td>
              <td>{{ category.code }}</td>
              <td>{{ category.name }}</td>
              <td>{{ category.transactionTypeEnum }}</td>
              <td>
                <input type="checkbox" [(ngModel)]="category.selected">
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

    </app-card>
  </div>
</div>
