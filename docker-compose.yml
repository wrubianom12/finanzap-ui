version: '3.8'
services:
  finanzapp-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production

    networks:
      - docker-network-finanzap

networks:
  docker-network-finanzap:
    external: true
